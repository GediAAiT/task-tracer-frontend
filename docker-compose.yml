services:
  web:
    build: .
    restart: unless-stopped
    init: true
    environment:
      API_URL: ${BACKEND_URL:-http://api:3000}
      PORT: 3001
      HOSTNAME: 0.0.0.0
    ports:
      - '${WEB_PORT:-3001}:3001'
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:3001/').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks:
      - backend

networks:
  backend:
    external: true
    name: ${BACKEND_NETWORK:-task-tracer-backend_default}
